services:
  api:
    image: url-shortener-api
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url-shortener-api

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://admin:admin@db:5432/shortener?schema=public
      HOST: 0.0.0.0
      PORT: 3000

    ports:
      - "3000:3000"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16

    container_name: url-shortener-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: shortener

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shortener"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: